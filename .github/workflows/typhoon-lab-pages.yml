name: Deploy typhoon-lab to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["typhoon-lab/**", ".github/workflows/typhoon-lab-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test typhoon-lab/test/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: typhoon-lab
      - id: deployment
        uses: actions/deploy-pages@v4
