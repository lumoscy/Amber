<meta charset="utf-8">
<title>琥珀日记</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Composer on top, then a wall of resin drops grouped by month. Pine forest ground, because amber is fossil pine resin. */
:root {
  --bg: #ECF0EA;
  --surface: #F8FAF6;
  --fg: #1E2A23;
  --muted: #5E6C63;
  --line: #CDD6CC;
  --accent: #C9761A;
  --accent-ink: #FFF8EE;
  --danger: #A63A2A;
  --glow: 0;
  --font-display: "ZCOOL XiaoWei", "Songti SC", "Noto Serif SC", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A16; --surface: #1A241F; --fg: #E6ECE4; --muted: #94A399; --line: #2C3A32;
    --accent: #E8992F; --accent-ink: #1A1206; --danger: #E07A66; --glow: 1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A16; --surface: #1A241F; --fg: #E6ECE4; --muted: #94A399; --line: #2C3A32;
  --accent: #E8992F; --accent-ink: #1A1206; --danger: #E07A66; --glow: 1; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; padding-block: 32px 56px; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.1; margin: 0; letter-spacing: 0.04em; }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.stats { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
.stat b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 24px; line-height: 1.1; color: var(--accent); }
.stat span { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }

.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.composer label.q { font-family: var(--font-display); font-size: 20px; }
textarea, input[type="date"] {
  width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
textarea { resize: vertical; min-height: 72px; }
textarea:focus-visible, input:focus-visible, button:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.resins { display: flex; gap: 8px; flex-wrap: wrap; border: 0; padding: 0; margin: 0; }
.resins legend { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 6px; padding: 0; }
.resin { position: relative; }
.resin input { position: absolute; opacity: 0; pointer-events: none; }
.resin label {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 4px 10px 4px 6px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted);
}
.resin label i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), transparent 40%), var(--c); }
.resin input:checked + label { border-color: var(--c); color: var(--fg); background: color-mix(in oklab, var(--c) 14%, transparent); }
.resin input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

button { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 8px 16px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 9px 22px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 45%, transparent); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-radius: 0; padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.month { display: flex; flex-direction: column; gap: 14px; }
.month h2 { margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0.08em; }
.wall { display: flex; flex-direction: column; gap: 28px; }
.drops { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 18px 10px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; border-radius: 8px; color: var(--fg); }
.gem {
  --size: 60px; width: var(--size); height: var(--size);
  display: grid; place-items: center;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), rgba(255,255,255,0) 20%),
    radial-gradient(circle at 62% 68%, color-mix(in oklab, var(--c) 70%, #000) 0%, transparent 70%),
    radial-gradient(circle at 45% 45%, color-mix(in oklab, var(--c) 75%, #fff) 0%, var(--c) 60%);
  box-shadow: inset 0 -4px 10px color-mix(in oklab, var(--c) 55%, #000), 0 4px 10px color-mix(in oklab, var(--c) 30%, transparent),
              0 0 calc(var(--glow) * 22px) color-mix(in oklab, var(--c) 45%, transparent);
  transition: transform .25s ease;
}
.gem span { font-family: var(--font-display); font-size: calc(var(--size) * .36); color: color-mix(in oklab, var(--c) 35%, #2a1400); opacity: .55; }
.drop:hover .gem { transform: translateY(-3px) rotate(-4deg); }
.drop small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.drop.sample { opacity: .55; }
.drop.new .gem { animation: set .9s cubic-bezier(.2,.8,.2,1); }
@keyframes set { from { transform: scale(.3); filter: blur(4px) saturate(.3); } to { transform: none; filter: none; } }

.empty { color: var(--muted); font-size: 14px; margin: 0; }
.tag { display: inline-block; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 1px 8px; }

.capsules { display: flex; flex-direction: column; gap: 10px; }
.capsule { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.capsule .seal { flex: none; width: 36px; height: 36px; border-radius: 50% 50% 46% 54%; display: grid; place-items: center; font-size: 16px;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.6), transparent 35%), var(--accent); color: var(--accent-ink); }
.capsule .body { flex: 1; min-width: 0; }
.capsule .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.capsule p { margin: 4px 0 0; overflow-wrap: anywhere; }
.capsule.locked p { color: var(--muted); font-style: italic; }

.sheet { position: fixed; inset: 0; background: color-mix(in oklab, var(--bg) 60%, transparent); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.card .gem { --size: 96px; }
.card blockquote { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.5; overflow-wrap: anywhere; }
.card .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.card .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status.cloud i { background: #4E9A6B; }
.status.local i { background: var(--accent); }
.toast { min-height: 1.4em; font-size: 13px; color: var(--muted); margin: 0; }
footer { color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 480px) { h1 { font-size: 34px; } .stats { gap: 16px; } }
@media (prefers-reduced-motion: reduce) { .gem, .drop.new .gem { transition: none; animation: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>琥珀日记</h1>
      <p class="tagline">每天一句话，把今天封进琥珀里。</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>颗琥珀</span></div>
      <div class="stat"><b id="statStreak">0</b><span>天连续</span></div>
    </div>
  </header>

  <section class="tabs" role="tablist" aria-label="视图">
    <button id="tabWall" role="tab" aria-selected="true" aria-controls="viewWall">琥珀墙</button>
    <button id="tabCapsule" role="tab" aria-selected="false" aria-controls="viewCapsule">时间胶囊</button>
  </section>

  <div id="viewWall" role="tabpanel" aria-labelledby="tabWall" style="display:flex;flex-direction:column;gap:28px">
    <form class="composer" id="momentForm">
      <label class="q" for="momentText">今天有什么想留住的瞬间？</label>
      <textarea id="momentText" maxlength="140" placeholder="比如：楼下的猫今天终于让我摸了。"></textarea>
      <fieldset class="resins" id="resinPicker">
        <legend>选一种琥珀，代表今天的心情</legend>
      </fieldset>
      <div class="row">
        <span class="count" id="momentCount">0 / 140</span>
        <button class="primary" type="submit" id="momentSubmit" disabled>封存</button>
      </div>
    </form>
    <p class="toast" id="toast" role="status"></p>
    <div class="wall" id="wall" aria-live="polite"></div>
  </div>

  <div id="viewCapsule" role="tabpanel" aria-labelledby="tabCapsule" hidden style="display:flex;flex-direction:column;gap:28px">
    <form class="composer" id="capsuleForm">
      <label class="q" for="capsuleText">写给未来的自己</label>
      <textarea id="capsuleText" maxlength="1000" placeholder="一年后的你，现在过得怎么样？"></textarea>
      <div class="row">
        <label for="capsuleDate" style="font-size:13px;color:var(--muted);flex:1;min-width:180px">开启日期<input type="date" id="capsuleDate" style="margin-top:6px"></label>
        <button class="primary" type="submit" id="capsuleSubmit" disabled>埋下胶囊</button>
      </div>
    </form>
    <div class="capsules" id="capsuleList"></div>
  </div>

  <footer>
    <div class="status" id="status" style="justify-content:center"><i></i><span>正在打开你的琥珀盒…</span></div>
    <p style="margin:8px 0 0">真正的琥珀要花几百万年才能形成，这里只要按一下。</p>
  </footer>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetText" id="sheetCard"></div>
</div>

<script>
(function () {
  // Real amber varieties stand in for moods.
  const RESINS = [
    { id: "gold",  name: "金珀", mood: "开心", c: "#E3A12F" },
    { id: "honey", name: "蜜蜡", mood: "温暖", c: "#D9B25A" },
    { id: "blood", name: "血珀", mood: "激动", c: "#B4462B" },
    { id: "green", name: "绿珀", mood: "平静", c: "#8E9C3E" },
    { id: "blue",  name: "蓝珀", mood: "低落", c: "#4F7FA6" },
  ];
  const resinOf = id => RESINS.find(r => r.id === id) || RESINS[0];
  const LOCAL_KEY = "amber-diary-v1";

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const dayOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = () => dayOf(new Date());
  const addDays = (day, n) => { const [y, m, d] = day.split("-").map(Number); return dayOf(new Date(y, m - 1, d + n)); };
  const daysBetween = (a, b) => { const [y1, m1, d1] = a.split("-").map(Number), [y2, m2, d2] = b.split("-").map(Number);
    return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

  let entries = [];
  let mode = "pending";   // pending | cloud | local
  let store = null;
  let justAdded = null;

  // ---------- storage ----------
  function localLoad() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch { return []; } }
  function localSave() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(entries)); return true; } catch { return false; } }

  const localStore = {
    async put(e) { entries = entries.filter(x => x.id !== e.id).concat(e); if (!localSave()) throw new Error("local"); render(); },
    async remove(id) { entries = entries.filter(x => x.id !== id); localSave(); render(); },
  };

  function useLocal() {
    mode = "local"; store = localStore; entries = localLoad();
    setStatus("local", "保存在这台设备的浏览器里");
    render();
  }

  async function init() {
    render();
    if (!window.claude || typeof window.claude.use !== "function") return useLocal();
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) return useLocal();
      const col = db.collection("data/users/" + uid);
      store = {
        async put(e) { const { id, ...body } = e; await col.doc(id).set(body); },
        async remove(id) { await col.doc(id).delete(); },
      };
      mode = "cloud";
      setStatus("cloud", "已保存到你的账号，只有你能看到");
      col.onSnapshot(snap => {
        entries = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
        render();
      }, err => {
        if (err && err.code === "revoked") setStatus("local", "暂时连不上你的琥珀盒，请刷新页面");
      });
    } catch { useLocal(); }
  }

  function setStatus(kind, text) { const s = $("status"); s.className = "status " + kind; s.querySelector("span").textContent = text; }
  let toastTimer;
  function toast(text) { $("toast").textContent = text; clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").textContent = "", 3200); }

  async function save(e) {
    if (!store) { toast("琥珀盒还没打开，请稍等一下再试。"); return false; }
    try {
      if (mode === "cloud") { entries = entries.filter(x => x.id !== e.id).concat(e); render(); }
      await store.put(e); return true;
    } catch (err) {
      entries = entries.filter(x => x.id !== e.id); render();
      toast(err && err.code === "quota_exceeded" ? "琥珀盒已经满了，删掉一些旧的再试。" : "没能保存，请检查网络后再试一次。");
      return false;
    }
  }

  // ---------- derived ----------
  const moments = () => entries.filter(e => e.kind === "moment").sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const capsules = () => entries.filter(e => e.kind === "capsule").sort((a, b) => a.openOn.localeCompare(b.openOn));
  function streak() {
    const days = new Set(moments().map(m => m.day));
    let d = today(); if (!days.has(d)) d = addDays(d, -1);
    let n = 0; while (days.has(d)) { n++; d = addDays(d, -1); }
    return n;
  }

  // ---------- render ----------
  function gem(entry, size) {
    const r = resinOf(entry.resin), h = hash(entry.id);
    const g = document.createElement("div");
    g.className = "gem";
    const p = i => 42 + ((h >>> (i * 4)) & 15);
    g.style.borderRadius = `${p(0)}% ${100 - p(0)}% ${p(1)}% ${100 - p(1)}% / ${p(2)}% ${p(3)}% ${100 - p(3)}% ${100 - p(2)}%`;
    g.style.setProperty("--c", r.c);
    g.style.setProperty("--size", (size || (54 + Math.min(entry.text.length, 60) * 0.4)) + "px");
    const s = document.createElement("span"); s.textContent = Array.from(entry.text.trim())[0] || "·";
    g.appendChild(s);
    return g;
  }

  const SAMPLES = [
    { id: "s1", text: "楼下的猫今天终于让我摸了", resin: "gold", day: "示例" },
    { id: "s2", text: "雨停的时候，天边有一道很淡的彩虹", resin: "green", day: "示例" },
    { id: "s3", text: "加班到很晚，但同事给我留了一块蛋糕", resin: "honey", day: "示例" },
  ];

  function renderWall() {
    const wall = $("wall"); wall.replaceChildren();
    const list = moments();
    if (mode === "pending") { const p = document.createElement("p"); p.className = "empty"; p.textContent = "正在打开你的琥珀盒…"; wall.appendChild(p); return; }
    if (!list.length) {
      const m = document.createElement("section"); m.className = "month";
      const h = document.createElement("h2"); h.innerHTML = '你的琥珀会出现在这里 <span class="tag">下面是示例</span>';
      const grid = document.createElement("div"); grid.className = "drops";
      SAMPLES.forEach(s => { const d = document.createElement("div"); d.className = "drop sample"; d.append(gem(s, 58)); const sm = document.createElement("small"); sm.textContent = s.day; d.append(sm); grid.append(d); });
      m.append(h, grid); wall.append(m); return;
    }
    const byMonth = new Map();
    list.forEach(e => { const k = e.day.slice(0, 7); if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(e); });
    byMonth.forEach((items, k) => {
      const m = document.createElement("section"); m.className = "month";
      const h = document.createElement("h2"); const [y, mo] = k.split("-"); h.textContent = `${y} 年 ${Number(mo)} 月 · ${items.length} 颗`;
      const grid = document.createElement("div"); grid.className = "drops";
      items.forEach(e => {
        const b = document.createElement("button"); b.type = "button"; b.className = "drop" + (e.id === justAdded ? " new" : "");
        b.setAttribute("aria-label", `${e.day}：${e.text}`);
        b.append(gem(e)); const sm = document.createElement("small"); sm.textContent = e.day.slice(5).replace("-", "/"); b.append(sm);
        b.addEventListener("click", () => openMoment(e));
        grid.append(b);
      });
      m.append(h, grid); wall.append(m);
    });
  }

  function renderCapsules() {
    const box = $("capsuleList"); box.replaceChildren();
    const list = capsules();
    if (!list.length) {
      const p = document.createElement("p"); p.className = "empty";
      p.textContent = mode === "pending" ? "正在打开你的琥珀盒…" : "还没有胶囊。写一段话，选一个日期，到那天之前谁都打不开它，包括你自己。";
      box.append(p); return;
    }
    const t = today();
    list.forEach(c => {
      const locked = c.openOn > t;
      const row = document.createElement("div"); row.className = "capsule" + (locked ? " locked" : "");
      const seal = document.createElement("div"); seal.className = "seal"; seal.textContent = locked ? "封" : "启";
      const body = document.createElement("div"); body.className = "body";
      const meta = document.createElement("div"); meta.className = "meta";
      const left = daysBetween(t, c.openOn);
      meta.textContent = `埋于 ${c.createdAt.slice(0, 10)} · ${locked ? `还有 ${left} 天开启（${c.openOn}）` : `${c.openOn} 已可开启`}`;
      const p = document.createElement("p");
      if (locked) p.textContent = "胶囊还封着，到日子再来看。";
      else if (c.opened) p.textContent = c.text;
      else p.textContent = "时间到了，可以打开了。";
      body.append(meta, p);
      row.append(seal, body);
      if (!locked && !c.opened) {
        const b = document.createElement("button"); b.className = "primary"; b.type = "button"; b.textContent = "打开";
        b.addEventListener("click", () => save({ ...c, opened: true }));
        row.append(b);
      }
      box.append(row);
    });
  }

  function render() {
    $("statTotal").textContent = moments().length;
    $("statStreak").textContent = streak();
    renderWall(); renderCapsules();
  }

  // ---------- detail sheet ----------
  function closeSheet() { $("sheet").hidden = true; }
  function openMoment(e) {
    const card = $("sheetCard"); card.replaceChildren();
    const r = resinOf(e.resin);
    const q = document.createElement("blockquote"); q.id = "sheetText"; q.textContent = e.text;
    const meta = document.createElement("div"); meta.className = "meta";
    const ago = daysBetween(e.day, today());
    meta.textContent = `${e.day} · ${r.name}（${r.mood}）· ${ago === 0 ? "今天封存" : `已封存 ${ago} 天`}`;
    const actions = document.createElement("div"); actions.className = "actions";
    const close = document.createElement("button"); close.type = "button"; close.textContent = "收起";
    close.addEventListener("click", closeSheet);
    const del = document.createElement("button"); del.type = "button"; del.className = "danger"; del.textContent = "敲碎这颗";
    del.addEventListener("click", async () => {
      if (del.dataset.armed) { closeSheet(); try { await store.remove(e.id); toast("已删除。"); } catch { toast("没能删除，请稍后再试。"); } return; }
      del.dataset.armed = "1"; del.textContent = "确定删除？删了找不回来";
    });
    actions.append(close, del);
    card.append(gem(e, 96), q, meta, actions);
    $("sheet").hidden = false; close.focus();
  }
  $("sheet").addEventListener("click", ev => { if (ev.target.id === "sheet") closeSheet(); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });

  // ---------- composer ----------
  RESINS.forEach((r, i) => {
    const w = document.createElement("span"); w.className = "resin"; w.style.setProperty("--c", r.c);
    w.innerHTML = `<input type="radio" name="resin" id="resin-${r.id}" value="${r.id}"${i === 0 ? " checked" : ""}><label for="resin-${r.id}"><i></i>${r.name} · ${r.mood}</label>`;
    $("resinPicker").append(w);
  });
  const mt = $("momentText");
  mt.addEventListener("input", () => { $("momentCount").textContent = `${Array.from(mt.value).length} / 140`; $("momentSubmit").disabled = !mt.value.trim(); });
  $("momentForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const text = mt.value.trim(); if (!text) return;
    const now = new Date();
    const e = { id: newId(), kind: "moment", text, resin: document.querySelector('input[name="resin"]:checked').value, day: dayOf(now), createdAt: now.toISOString() };
    justAdded = e.id;
    $("momentSubmit").disabled = true;
    if (await save(e)) { mt.value = ""; $("momentCount").textContent = "0 / 140"; toast("封存好了。"); }
    else $("momentSubmit").disabled = false;
  });

  const ct = $("capsuleText"), cd = $("capsuleDate");
  cd.min = addDays(today(), 1); cd.value = addDays(today(), 365);
  const checkCapsule = () => { $("capsuleSubmit").disabled = !ct.value.trim() || !cd.value || cd.value <= today(); };
  ct.addEventListener("input", checkCapsule); cd.addEventListener("input", checkCapsule);
  $("capsuleForm").addEventListener("submit", async ev => {
    ev.preventDefault(); checkCapsule(); if ($("capsuleSubmit").disabled) return;
    const e = { id: newId(), kind: "capsule", text: ct.value.trim(), openOn: cd.value, opened: false, createdAt: new Date().toISOString() };
    $("capsuleSubmit").disabled = true;
    if (await save(e)) { ct.value = ""; toast(""); }
    checkCapsule();
  });

  // ---------- tabs ----------
  function show(which) {
    const wall = which === "wall";
    $("tabWall").setAttribute("aria-selected", wall); $("tabCapsule").setAttribute("aria-selected", !wall);
    $("viewWall").hidden = !wall; $("viewCapsule").hidden = wall;
  }
  $("tabWall").addEventListener("click", () => show("wall"));
  $("tabCapsule").addEventListener("click", () => show("capsule"));
  if (location.hash === "#capsule") show("capsule");

  init();
})();
</script>
